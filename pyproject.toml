[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polyugenai2api"
version = "0.1.0"
description = "Local OpenAI Chat Completions adapter for PolyU GenAI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "anyio>=4,<5"]

[project.optional-dependencies]
login = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "openai>=1.60,<3"]

[project.scripts]
polyugenai2api = "polyugenai2api.cli:main"

[tool.setuptools.packages.find]
include = ["polyugenai2api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
